name: UIAdapt v4.1 verification

on:
  push:
    branches: [main, codex/uiadapt-investor-r8-remediation, codex/uiadapt-distribution-engine-v1]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm test

      - name: Telemetry API contract tests
        run: npm run test:api

      - name: Password gateway tests
        run: npm run test:gateway

      - name: Deployment contract tests
        run: npm run test:deployment

      - name: Stage physical entry contract
        run: npm run test:stage-entry

      - name: Verify build bases
        run: npm run verify:build-bases

      - name: Production build
        run: npm run build

      - name: NWG build and staging
        run: npm run build:nwg

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Install video evidence inspector
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Nested-path browser tests
        run: npm run test:e2e

      - name: Install exact Chrome 145 for the R12 Stage gate
        run: |
          set -euo pipefail
          CHROME_ARCHIVE="$RUNNER_TEMP/chrome-145.zip"
          CHROME_ROOT="$RUNNER_TEMP/chrome-145"
          curl --fail --location --retry 3 \
            --output "$CHROME_ARCHIVE" \
            "https://storage.googleapis.com/chrome-for-testing-public/145.0.7632.117/linux64/chrome-linux64.zip"
          mkdir -p "$CHROME_ROOT"
          unzip -q "$CHROME_ARCHIVE" -d "$CHROME_ROOT"
          CF_CHROME_BIN="$CHROME_ROOT/chrome-linux64/chrome"
          CHROME_VERSION="$("$CF_CHROME_BIN" --version)"
          printf 'Chrome gate: %s\n' "$CHROME_VERSION"
          [[ "$CHROME_VERSION" =~ ^Google\ Chrome\ for\ Testing\ 145\.0\.7632\.117[[:space:]]*$ ]]
          echo "CF_CHROME_BIN=$CF_CHROME_BIN" >> "$GITHUB_ENV"

      - name: R12 Stage contract tests
        run: npm run test:e2e:stage

      - name: R12 Stage SSIM and recording evidence
        run: npm run stage:evidence

      - name: Production dependency audit
        run: |
          set -o pipefail
          npm audit --omit=dev --audit-level=high 2>&1 | tee audit-results.txt

      - name: Check diff whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            EMPTY_TREE="$(git hash-object -t tree /dev/null)"
            git diff --check "$EMPTY_TREE" "$HEAD_SHA" -- . ':(exclude)evidence/**'
          else
            git diff --check "$BASE_SHA...$HEAD_SHA" -- . ':(exclude)evidence/**'
          fi

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uiadapt-v4.1-verification-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
            dist/
            review/r12/evidence/
            audit-results.txt
          if-no-files-found: ignore

  runtime-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Password gateway tests
        run: npm run test:gateway

      - name: Deployment contract tests
        run: npm run test:deployment

  api-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: uiadapt_demo
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply disposable schema and grant application account
        run: |
          set -eu
          export UIADAPT_MYSQL_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$UIADAPT_MYSQL_PASSWORD"
          mysql --protocol=tcp -h 127.0.0.1 -uroot uiadapt_demo < db/001-uiadapt-demo.sql
          mysql --protocol=tcp -h 127.0.0.1 -uroot uiadapt_demo < db/002-uiadapt-snapshot-adaptive.sql
          mysql --protocol=tcp -h 127.0.0.1 -uroot uiadapt_demo <<SQL
          CREATE USER IF NOT EXISTS 'uiadapt_demo_app'@'%' IDENTIFIED BY '$UIADAPT_MYSQL_PASSWORD';
          ALTER USER 'uiadapt_demo_app'@'%' IDENTIFIED BY '$UIADAPT_MYSQL_PASSWORD';
          GRANT SELECT, INSERT, LOCK TABLES ON uiadapt_demo.* TO 'uiadapt_demo_app'@'%';
          FLUSH PRIVILEGES;
          SQL
          echo "UIADAPT_MYSQL_PASSWORD=$UIADAPT_MYSQL_PASSWORD" >> "$GITHUB_ENV"

      - name: MySQL API integration
        env:
          UIADAPT_INTEGRATION: "1"
          UIADAPT_DB_USER: uiadapt_demo_app
        run: npm run test:api-integration
