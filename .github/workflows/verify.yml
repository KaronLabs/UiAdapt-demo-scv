name: UIAdapt v4.1 verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm test

      - name: Password gateway tests
        run: npm run test:gateway

      - name: Production build
        run: npm run build

      - name: Deployment contract tests
        run: npm run test:deployment

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Nested-path browser tests
        run: npm run test:e2e

      - name: Production dependency audit
        run: |
          set -o pipefail
          npm audit --omit=dev --audit-level=high 2>&1 | tee audit-results.txt

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uiadapt-v4.1-verification-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
            dist/
            audit-results.txt
          if-no-files-found: ignore

  runtime-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Password gateway tests
        run: npm run test:gateway

      - name: Deployment contract tests
        run: npm run test:deployment
