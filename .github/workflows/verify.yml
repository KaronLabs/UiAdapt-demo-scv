name: UIAdapt v4.1 verification

on:
  push:
    branches: [main, codex/uiadapt-investor-r8-remediation]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm test

      - name: Telemetry API contract tests
        run: npm run test:api

      - name: Password gateway tests
        run: npm run test:gateway

      - name: Deployment contract tests
        run: npm run test:deployment

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Nested-path browser tests
        run: npm run test:e2e

      - name: Production dependency audit
        run: |
          set -o pipefail
          npm audit --omit=dev --audit-level=high 2>&1 | tee audit-results.txt

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uiadapt-v4.1-verification-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
            dist/
            audit-results.txt
          if-no-files-found: ignore

  runtime-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Password gateway tests
        run: npm run test:gateway

      - name: Deployment contract tests
        run: npm run test:deployment

  api-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.UIADAPT_CI_MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: uiadapt_demo
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply disposable schema and grant application account
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.UIADAPT_CI_MYSQL_ROOT_PASSWORD }}
          UIADAPT_MYSQL_PASSWORD: ${{ secrets.UIADAPT_CI_MYSQL_APP_PASSWORD }}
        run: |
          export MYSQL_PWD="$MYSQL_ROOT_PASSWORD"
          mysql --protocol=tcp -h 127.0.0.1 -uroot uiadapt_demo < db/001-uiadapt-demo.sql
          mysql --protocol=tcp -h 127.0.0.1 -uroot uiadapt_demo <<SQL
          CREATE USER IF NOT EXISTS 'uiadapt_demo_app'@'127.0.0.1' IDENTIFIED BY '$UIADAPT_MYSQL_PASSWORD';
          ALTER USER 'uiadapt_demo_app'@'127.0.0.1' IDENTIFIED BY '$UIADAPT_MYSQL_PASSWORD';
          GRANT SELECT, INSERT, UPDATE ON uiadapt_demo.* TO 'uiadapt_demo_app'@'127.0.0.1';
          FLUSH PRIVILEGES;
          SQL
          unset MYSQL_PWD

      - name: MySQL API integration
        env:
          UIADAPT_INTEGRATION: "1"
          UIADAPT_DB_USER: uiadapt_demo_app
          UIADAPT_MYSQL_PASSWORD: ${{ secrets.UIADAPT_CI_MYSQL_APP_PASSWORD }}
        run: npm run test:api-integration
